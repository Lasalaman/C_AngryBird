<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Angry Bird · 物理模擬</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🎯</span>
        <div>
          <h1>Angry Bird</h1>
          <p class="subtitle">C 物理引擎 · 持久化關卡</p>
        </div>
      </div>
      <div class="header-actions">
        <div id="birdStock" class="bird-stock" aria-label="剩餘小鳥">
          <span class="bird-stock-label">小鳥</span>
          <div id="birdDots" class="bird-dots"></div>
        </div>
        <button type="button" id="resetBtn" class="btn-reset">重置關卡</button>
        <div id="statusBadge" class="badge badge-idle">就緒</div>
      </div>
    </header>

    <main class="layout">
      <aside class="panel controls">
        <section class="section">
          <h2>發射參數</h2>
          <div class="field">
            <label for="angle">發射角度 <span class="unit">°</span></label>
            <input type="number" id="angle" value="35" min="0" max="89" step="1" />
          </div>
          <div class="field">
            <label for="velocity">初始速度 <span class="unit">px/s</span></label>
            <input type="number" id="velocity" value="550" min="1" max="2000" step="10" />
          </div>
        </section>

        <details class="advanced">
          <summary>進階設定</summary>
          <div class="advanced-body">
            <div class="field">
              <label for="gravity">重力</label>
              <input type="number" id="gravity" value="980" min="0" step="10" />
            </div>
            <div class="field-row">
              <div class="field">
                <label for="start_x">起始 X</label>
                <input type="number" id="start_x" value="120" step="1" />
              </div>
              <div class="field">
                <label for="start_y">起始 Y</label>
                <input type="number" id="start_y" value="380" step="1" />
              </div>
            </div>
          </div>
        </details>

        <button type="button" id="launchBtn" class="btn-launch">
          <span class="btn-label">發射 Launch</span>
          <span class="btn-spinner" hidden aria-hidden="true"></span>
        </button>

        <div id="resultMeta" class="meta" hidden>
          <div class="meta-item"><span>碰撞</span><strong id="metaHit">—</strong></div>
          <div class="meta-item"><span>出界</span><strong id="metaOob">—</strong></div>
          <div class="meta-item"><span>剩餘鳥</span><strong id="metaBirds">—</strong></div>
        </div>
      </aside>

      <section class="panel canvas-panel">
        <div class="canvas-header">
          <h2>關卡 1</h2>
          <span class="hint">擊敗綠豬 · 木箱狀態會保留</span>
        </div>
        <div class="canvas-wrap">
          <canvas id="simCanvas" width="1280" height="720" aria-label="遊戲畫布"></canvas>
        </div>
      </section>
    </main>
  </div>

  <div id="gameModal" class="modal" hidden aria-hidden="true">
    <div class="modal-backdrop"></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div id="modalIcon" class="modal-icon">🏆</div>
      <h2 id="modalTitle" class="modal-title">遊戲勝利</h2>
      <p id="modalMessage" class="modal-message">你擊敗了所有小豬！</p>
      <button type="button" id="modalResetBtn" class="btn-launch modal-btn">關卡重製</button>
    </div>
  </div>

  <div id="toast" class="toast" role="alert" aria-live="assertive" hidden></div>

  <script src="{{ url_for('static', filename='js/renderer.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/simulator.js') }}" defer></script>
</body>
</html>
